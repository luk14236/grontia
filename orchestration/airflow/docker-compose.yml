x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Airflow 3: task workers call the Execution API on the api-server container,
    # and every component must sign/verify task JWTs with the same secret.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    # Local defaults; override in .env (required before exposing this anywhere)
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-grontia-local-dev-jwt-secret}
    # MinIO / S3-compatible storage
    MINIO_ENDPOINT: http://s3:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET_BRONZE: bronze
    MINIO_BUCKET_SILVER: silver
    MINIO_BUCKET_GOLD: gold
    # Silver (PySpark) and gold (dbt) steps run from the pipeline venv
    PIPELINE_VENV: /home/airflow/pipeline-venv
    SPARK_JARS_PACKAGES: ''   # S3A jars are baked into the image
    GRONTIA_DBT_TARGET: ${GRONTIA_DBT_TARGET:-dev}
    GRONTIA_DUCKDB_PATH: /opt/grontia/warehouse/grontia.duckdb
    MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:-}
  labels:
    autoheal: 'true'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - airflow_logs:/opt/airflow/logs
    - ../../processing:/opt/grontia/processing:ro
    - ../../evaluation:/opt/grontia/evaluation:ro
    - ../../analytics/dbt:/opt/grontia/dbt
    - warehouse:/opt/grontia/warehouse
  depends_on:
    postgres:
      condition: service_healthy
    s3:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@grontia.local || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # S3-compatible object storage (bronze/silver/gold).
  # SeaweedFS replaces MinIO: the official MinIO images are no longer published.
  # Credentials stay minioadmin/minioadmin so all MINIO_* env vars keep working.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "8888:8888"   # Filer UI (browse buckets under /buckets)
    volumes:
      - s3_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      for b in bronze silver gold; do
        echo \"s3.bucket.create -name $$b\" | weed shell -master=s3:9333;
      done;
      echo 'Buckets criados: bronze, silver, gold';
      "
    restart: "no"

  # After a reboot Docker restarts every container at once, ignoring depends_on.
  # Airflow can come up before Postgres and get stuck unhealthy; autoheal
  # restarts any container labelled autoheal=true once it turns unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 180
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  warehouse:
  postgres_data:
  s3_data:
  airflow_logs:
