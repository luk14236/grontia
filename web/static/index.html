<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grontia</title>
  <meta name="description" content="Check whether the asking price or rent of a Dutch home is in line with open government data.">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="brand/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="brand/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="brand/favicon-180.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#003DA5">
  <meta property="og:title" content="Grontia">
  <meta property="og:description" content="Is this price or rent in line with the open data? Value, legal rent, outlook and neighbourhood for any Dutch address.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://grontia-304a9d81f22f.herokuapp.com/brand/grontia-wordmark.png">
  <meta property="og:image:width" content="1800">
  <meta property="og:image:height" content="440">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="flagbar" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="map" aria-label="Map"></div>

  <main class="panel" id="panel">
    <button type="button" class="sheet-handle" id="sheet-handle" data-i18n-aria="sheetToggle"><span></span></button>
    <header class="brand">
      <a class="mark" href="./">
        <img src="brand/grontia-symbol.svg" alt="" width="48" height="48">
        <span><h1>Grontia</h1><p data-i18n="tagline"></p></span>
      </a>
      <div class="tools">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="nl">NL</button>
        </div>
        <button type="button" class="link" id="about-btn" aria-expanded="false" aria-controls="about" data-i18n="aboutBtn"></button>
      </div>
    </header>

    <section id="about" class="about" hidden></section>

    <div id="tool" class="tool">

    <div id="search-area" class="search-area">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-address" aria-controls="pane-address" aria-selected="true" data-i18n="tabAddress"></button>
      <button type="button" role="tab" id="tab-pdf" aria-controls="pane-pdf" aria-selected="false" data-i18n="tabPdf"></button>
    </div>

    <section id="pane-pdf" role="tabpanel" aria-labelledby="tab-pdf" hidden>
      <label class="drop" id="drop" for="pdf-input">
        <input type="file" id="pdf-input" accept="application/pdf">
        <strong data-i18n="dropTitle"></strong>
        <span data-i18n="dropHint"></span>
      </label>
      <span class="label-row"><span class="note" data-i18n="pdfPrivacy"></span><button type="button" class="hint" data-hint="hints.pdf"></button></span>
      <p class="status" id="pdf-status" role="status"></p>
    </section>

    <form id="form" novalidate>
      <section id="pane-address" role="tabpanel" aria-labelledby="tab-address">
        <div class="field search">
          <span class="label-row"><label for="search" data-i18n="searchLabel"></label><button type="button" class="hint" data-hint="hints.search"></button></span>
          <input id="search" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggestions" data-i18n-placeholder="searchPlaceholder">
          <ul id="suggestions" role="listbox" hidden></ul>
          <p class="status" id="search-status" role="status"></p>
        </div>
      </section>

      <div class="banner" id="pdf-banner" hidden data-i18n="pdfBanner"></div>

      <div class="row">
        <div class="field"><span class="label-row"><label for="postcode" data-i18n="postcode"></label><button type="button" class="hint" data-hint="hints.postcode"></button></span><input id="postcode" name="postcode" required placeholder="1234AB" maxlength="7"></div>
        <div class="field small"><span class="label-row"><label for="number" data-i18n="number"></label><button type="button" class="hint" data-hint="hints.number"></button></span><input id="number" name="number" required inputmode="numeric" placeholder="9"></div>
        <div class="field small"><span class="label-row"><label for="suffix" data-i18n="suffix"></label><button type="button" class="hint" data-hint="hints.suffix"></button></span><input id="suffix" name="suffix" maxlength="6" placeholder="A"></div>
      </div>

      <span class="label-row"><span class="label" data-i18n="modeLabel"></span><button type="button" class="hint" data-hint="hints.mode"></button></span>
      <div class="mode segmented" role="radiogroup" data-i18n-aria="modeLabel">
        <label><input type="radio" name="mode" value="sale" checked><span data-i18n="modeSale"></span></label>
        <label><input type="radio" name="mode" value="rent"><span data-i18n="modeRent"></span></label>
      </div>

      <div class="row" data-mode="sale">
        <div class="field"><span class="label-row"><label for="asking_price" data-i18n="askingPrice"></label><button type="button" class="hint" data-hint="hints.asking_price"></button></span><input id="asking_price" name="asking_price" inputmode="decimal" placeholder="€ 400000"></div>
      </div>
      <div class="row" data-mode="rent" hidden>
        <div class="field"><span class="label-row"><label for="rent" data-i18n="rent"></label><button type="button" class="hint" data-hint="hints.rent"></button></span><input id="rent" name="rent" inputmode="decimal" placeholder="€ 1500"></div>
        <div class="field"><span class="label-row"><label for="deposit" data-i18n="deposit"></label><button type="button" class="hint" data-hint="hints.deposit"></button></span><input id="deposit" name="deposit" inputmode="decimal" placeholder="€ 3000"></div>
      </div>

      <details class="more">
        <summary><span data-i18n="moreDetails"></span><button type="button" class="hint" data-hint="hints.more"></button></summary>
        <div class="row">
          <div class="field"><span class="label-row"><label for="energy_label" data-i18n="energyLabel"></label><button type="button" class="hint" data-hint="hints.energy_label"></button></span><input id="energy_label" name="energy_label" maxlength="5" placeholder="A"></div>
          <div class="field"><span class="label-row"><label for="woz" data-i18n="woz"></label><button type="button" class="hint" data-hint="hints.woz"></button></span><input id="woz" name="woz" inputmode="decimal"></div>
          <div class="field small"><span class="label-row"><label for="woz_year" data-i18n="wozYear"></label><button type="button" class="hint" data-hint="hints.woz_year"></button></span><input id="woz_year" name="woz_year" inputmode="numeric" placeholder="2026"></div>
        </div>
        <p class="note" data-i18n="comparableHint"></p>
        <div class="row">
          <div class="field"><span class="label-row"><label for="comparable_price" data-i18n="comparablePrice"></label><button type="button" class="hint" data-hint="hints.comparable_price"></button></span><input id="comparable_price" name="comparable_price" inputmode="decimal"></div>
          <div class="field small"><span class="label-row"><label for="comparable_date" data-i18n="comparableDate"></label><button type="button" class="hint" data-hint="hints.comparable_date"></button></span><input id="comparable_date" name="comparable_date" placeholder="2026-06"></div>
          <div class="field small"><span class="label-row"><label for="comparable_m2" data-i18n="comparableM2"></label><button type="button" class="hint" data-hint="hints.comparable_m2"></button></span><input id="comparable_m2" name="comparable_m2" inputmode="decimal"></div>
        </div>
      </details>

      <button type="submit" class="primary" id="submit"></button>
      <p class="status" id="form-status" role="status"></p>
    </form>

    <section class="intro" id="intro">
      <h2 data-i18n="introTitle"></h2>
      <ul id="intro-list"></ul>
      <p class="intro-try" data-i18n="tryExample"></p>
      <div class="examples" id="examples"></div>
    </section>
    </div>

    <div class="summary-bar" id="summary-bar" hidden>
      <strong id="summary-address"></strong>
      <button type="button" class="secondary" id="edit-search" data-i18n="editSearch"></button>
    </div>

    <div class="progress" id="progress" hidden role="status">
      <div class="progress-bar"><span></span></div>
      <p id="progress-step"></p>
    </div>

    <section id="result" class="result" hidden aria-live="polite"></section>
    </div>

    <footer class="disclaimer" data-i18n="disclaimer"></footer>
  </main>

  <section id="detail" class="detail-view" hidden data-i18n-aria="detailTitle"></section>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <article id="report" class="report"></article>
  <style id="report-page-style" media="print"></style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="report.js"></script>
</body>
</html>
