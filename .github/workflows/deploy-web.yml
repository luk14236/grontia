name: Deploy web app (Heroku)

# Only the web app runs on Heroku; the data pipeline stays on the local
# machine. Pipeline-only commits don't trigger a deploy (and a dyno restart).
on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'evaluation/**'
      - 'requirements.txt'
      - 'Procfile'
      - '.python-version'
      - '.slugignore'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

env:
  HEROKU_APP: grontia
  HEROKU_URL: https://grontia-304a9d81f22f.herokuapp.com

jobs:
  check:
    name: Check web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install the same requirements Heroku installs
        run: pip install -r requirements.txt

      - name: Import the app and parse a sample listing
        run: |
          python -c "import web.app"
          python -c "from web.listing import extract_fields as f; r = f('Kerkstraat 12-A\n1017 GL Amsterdam\nHuurprijs € 1.895,- per maand'); assert r['postcode'] == '1017GL' and r['rent'] == 1895, r"

      - name: Check the front-end scripts
        run: |
          node --check web/static/app.js
          node --check web/static/i18n.js

  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Heroku rejects pushes from a shallow clone

      - name: Push to Heroku git
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" "HEAD:refs/heads/main"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -sf "$HEROKU_URL/api/health" && exit 0
            sleep 6
          done
          echo "Health check failed at $HEROKU_URL" && exit 1
