name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml boto3 requests apache-airflow==3.0.0 apache-airflow-providers-standard

      - name: Lint DAGs (syntax check)
        run: python -m py_compile orchestration/airflow/dags/*.py

      - name: Validate datasets catalog
        run: python -c "import yaml; yaml.safe_load(open('orchestration/airflow/include/configs/datasets.yml'))"

  dbt-validate:
    name: dbt Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: dbt parse (target=dev, DuckDB local)
        working-directory: analytics/dbt
        env:
          GRONTIA_DUCKDB_PATH: /tmp/grontia_ci.duckdb
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: dbt parse --target dev

  dbt-deploy:
    name: dbt Run (MotherDuck)
    runs-on: ubuntu-latest
    needs: [validate, dbt-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: dbt run + test (MotherDuck)
        working-directory: analytics/dbt
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MINIO_ENDPOINT:   ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          dbt run --target motherduck
          dbt test --target motherduck

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit safety

      - name: Bandit
        run: bandit -r orchestration/airflow/dags/ processing/ analytics/dbt/ -ll --exit-zero

      - name: Safety
        run: safety check --file orchestration/airflow/requirements.txt
        continue-on-error: true
