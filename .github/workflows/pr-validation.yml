name: PR Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'orchestration/airflow/**'
      - 'analytics/dbt/**'
      - 'processing/**'

jobs:
  airflow-check:
    name: Airflow DAG Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml boto3 requests apache-airflow==3.0.0 apache-airflow-providers-standard

      - name: Validate DAGs
        run: |
          python -c "
          from airflow.models import DagBag
          bag = DagBag(dag_folder='orchestration/airflow/dags', include_examples=False)
          if bag.import_errors:
              for f, e in bag.import_errors.items():
                  print(f'ERROR {f}: {e}')
              exit(1)
          print(f'OK — {len(bag.dags)} DAGs loaded')
          for dag_id in bag.dags:
              print(f'  - {dag_id}')
          "

      - name: Validate datasets catalog
        run: |
          python -c "
          import yaml
          catalog = yaml.safe_load(open('orchestration/airflow/include/configs/datasets.yml'))
          sources = list(catalog.keys())
          print(f'Catalog sources: {sources}')
          for src, cfg in catalog.items():
              n = len(cfg.get('datasets', []))
              print(f'  {src}: {n} dataset(s)')
          "

  dbt-check:
    name: dbt Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: dbt parse
        working-directory: analytics/dbt
        env:
          GRONTIA_DUCKDB_PATH: /tmp/grontia_ci.duckdb
        run: dbt parse --target dev
