name: 'grontia'
version: '1.0.0'
config-version: 2

profile: 'grontia'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  grontia:
    staging:
      # On MotherDuck, staging must be tables: a view would re-read the local
      # S3 store on every query, which the cloud (and other clients) can't reach.
      +materialized: "{{ 'table' if target.name == 'motherduck' else 'view' }}"
      +schema: STAGING
    intermediate:
      +materialized: view
      +schema: INTERMEDIATE
    marts:
      +materialized: table
      +schema: MARTS

on-run-end:
  - "{{ log_run_results(results) }}"
